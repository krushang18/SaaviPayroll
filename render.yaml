services:
  - type: web
    name: saavi-payroll-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      # Production database is hosted on Neon; set the connection string in the Render dashboard.
      - key: DATABASE_URL
        sync: false
